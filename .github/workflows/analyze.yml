name: Analyze voiceover
run-name: analyze ${{ inputs.slug }} ${{ inputs.token }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Video slug (videos/<slug>)"
        required: true
      model:
        description: "faster-whisper model"
        required: false
        default: "small.en"
      lang:
        description: "Voiceover language (en | ar)"
        required: false
        default: "en"
      sealed:
        description: "1 = audio arrives encrypted and results leave encrypted (reference videos, REF_KEY secret)"
        required: false
        default: "0"
      token:
        description: "Unique id so tools can find this run"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SLUG: ${{ inputs.slug }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools
            videos/${{ inputs.slug }}

      - name: Download voiceover (release vo-<slug>)
        run: |
          mkdir -p in
          gh release download "vo-$SLUG" --dir in --pattern 'voiceover.*' --repo "$GITHUB_REPOSITORY"
          ls -la in

      - name: Decrypt audio (sealed mode)
        if: ${{ inputs.sealed == '1' }}
        env:
          REF_KEY: ${{ secrets.REF_KEY }}
        run: |
          node tools/cloud/crypt.mjs decrypt in/voiceover.enc in/voiceover.wav
          rm in/voiceover.enc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/cloud/requirements.txt

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}-v1

      - name: Install faster-whisper
        run: pip install -r tools/cloud/requirements.txt

      - name: Transcribe + align to script
        run: |
          VO=$(ls in/voiceover.* | head -1)
          SCRIPT=videos/$SLUG/script.txt
          [ -f "$SCRIPT" ] || SCRIPT=-
          python tools/cloud/transcribe.py "$VO" "$SCRIPT" out/timing "${{ inputs.model }}" "${{ inputs.lang }}"

      - name: Encrypt results (sealed mode)
        if: ${{ inputs.sealed == '1' }}
        env:
          REF_KEY: ${{ secrets.REF_KEY }}
        run: |
          tar -czf timing.tgz -C out timing
          mkdir -p sealed
          node tools/cloud/crypt.mjs encrypt timing.tgz sealed/timing.enc
          rm -rf out/timing timing.tgz in

      - uses: actions/upload-artifact@v5
        if: ${{ inputs.sealed == '1' }}
        with:
          name: ${{ inputs.slug }}-timing
          path: sealed
          retention-days: 3

      - uses: actions/upload-artifact@v5
        if: ${{ inputs.sealed != '1' }}
        with:
          name: ${{ inputs.slug }}-timing
          path: out/timing
          retention-days: 30
