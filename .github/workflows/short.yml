name: short
run-name: short ${{ inputs.slug }} ${{ inputs.id }} ${{ inputs.token }}
# The vertical hook Short of a long video (tools/short.mjs). Renders the Short composition SILENT in 1080x1920 60 fps;
# the sound (the long video's master + the owner's outro voice) is added on the owner's PC. The props (the moment, the
# title, the subtitle WORDS = the unreleased script) arrive SEALED in release vo-<slug> and are opened only here.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Video slug (videos/<slug>)"
        required: true
      id:
        description: "Short number (videos/<slug>/shorts/short-<id>.json, sealed as short-<id>.enc)"
        required: true
        default: "1"
      token:
        description: "Unique id so tools can find this run"
        required: false

permissions:
  contents: read

env:
  SLUG: ${{ inputs.slug }}
  GH_TOKEN: ${{ github.token }}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            src
            tools
            library
            public/${{ inputs.slug }}
            public/_hosts
            videos/${{ inputs.slug }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm ci --no-audit --no-fund
      - name: Activate video
        run: node tools/activate.mjs "$SLUG" --quiet
      - name: Open the sealed Short props
        env:
          REF_KEY: ${{ secrets.REF_KEY }}
        run: |
          mkdir -p in
          gh release download "vo-$SLUG" --dir in --pattern "short-${{ inputs.id }}.enc" --repo "$GITHUB_REPOSITORY"
          node tools/cloud/crypt.mjs decrypt "in/short-${{ inputs.id }}.enc" in/props.json
          rm "in/short-${{ inputs.id }}.enc"
      - name: Render the Short (silent)
        run: |
          mkdir -p out
          npx remotion render Short out/short.mp4 --props=in/props.json \
            --muted --concurrency=100% --log=error --color-space=bt709 --jpeg-quality=100 --crf=12
          rm -f in/props.json
      - uses: actions/upload-artifact@v5
        with:
          name: short-${{ inputs.slug }}-${{ inputs.id }}
          path: out/short.mp4
          retention-days: 3
          compression-level: 0
